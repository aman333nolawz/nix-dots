# trakt.lua options
#
# Set up Trakt once with:
#   python3 ~/.config/mpv/script-opts/trakt.py --authorize

# Key to open the Trakt match/tracking menu
key=alt+t

# Python interpreter and backend script
python=python3
script=~~/script-opts/trakt.py

# Automatically match and scrobble movies and SxxExx episodes
auto=yes

# Show OSD notifications
notify=yes

# Ignore files shorter than this many seconds
min_duration=60

# Number of results in the manual match menu
limit=10
